<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Book a private training session or a free consultation with Erik Lund in Stockholm who offers training services to beginners and busy professionals."
        />
        <title>Book a session | Erik Lund</title>

        <!-- Font awesome import -->
        <script src="https://kit.fontawesome.com/bdb4373028.js" crossorigin="anonymous"></script>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <!-- Custom css -->
        <link rel="stylesheet" href="./assets/css/style.css" />
    </head>
    <body>
        <!-- Navigation section adapted from Bootstrap 5.3 documentation -->
        <nav class="navbar navbar-expand-md sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">EL</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-md-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#hero">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#about">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#services">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#testimonials">Testimonials</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="booking.html">Book</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main content -->
        <main>
            <section>
                <div class="container">
                    <div class="row">
                        <div class="col-12 col-md-8 col-lg-6">
                            <h1>Get in touch</h1>
                            <p>
                                Feel free to send me a message or book in a consultation. You can also DM me on
                                Instagram!
                            </p>

                            <!-- Form copied and altered from Bootstrap 5.3 documentation -->
                            <form action="thank-you.html" method="GET">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Name*</label>
                                    <input type="text" class="form-control" id="name" name="name" required />
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email*</label>
                                    <input type="email" class="form-control" id="email" name="email" required />
                                </div>
                                <div class="mb-3">
                                    <label for="phone" class="form-label">Phone</label>
                                    <input type="tel" class="form-control" id="phone" name="phone" />
                                </div>
                                <div class="mb-3">
                                    <label for="service" class="form-label">Which service are you interested in?</label>
                                    <select class="form-select" id="service" name="service">
                                        <option value="consultation">Free consultation</option>
                                        <option value="strength">Strength</option>
                                        <option value="endurance">Endurance</option>
                                        <option value="weight-loss">Weight loss</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label">Message</label>
                                    <textarea class="form-control" id="message" name="message" rows="4"></textarea>
                                </div>
                                <button type="submit" class="btn-book">Send message</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer section -->
        <footer>
            <div class="container">
                <div class="row">
                    <div class="col-12 col-md-6">
                        <p>Ironworks Gym, Stockholm</p>
                        <p><a href="mailto:erik.lund@email.com">erik.lund@email.com</a></p>
                        <p><a href="tel:+4612312312">+46 123 123 12</a></p>
                    </div>
                    <div class="col-12 col-md-6">
                        <a
                            href="https://www.instagram.com/"
                            target="_blank"
                            rel="noopener"
                            aria-label="Erik Lund on Instagram"
                            ><i class="fa-brands fa-instagram" aria-hidden="true"></i
                        ></a>
                        <a
                            href="https://www.facebook.com/"
                            target="_blank"
                            rel="noopener"
                            aria-label="Erik Lund on Facebook"
                            ><i class="fa-brands fa-facebook" aria-hidden="true"></i
                        ></a>
                        <a
                            href="https://www.youtube.com/"
                            target="_blank"
                            rel="noopener"
                            aria-label="Erik Lund on Youtube"
                            ><i class="fa-brands fa-youtube" aria-hidden="true"></i
                        ></a>
                    </div>
                </div>
            </div>
        </footer>

        <!-- JS for Bootstrap import -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <!-- JavaScript to collapse the Bootstrap navbar, from Code Institute course material -->
        <script>
            document.querySelectorAll(".navbar-collapse .nav-link").forEach((link) => {
                link.addEventListener("click", function (e) {
                    let section = document.querySelector(e.target.getAttribute("href"));
                    if (section) {
                        e.preventDefault(); // Prevent default anchor click behavior
                        let navbarHeight = document.querySelector(".navbar-toggler").offsetHeight;
                        window.scroll({
                            top: section.offsetTop - navbarHeight, // Adjust for navbar height
                            behavior: "smooth",
                        });
                        document.querySelector(".navbar-collapse").classList.remove("show"); // Collapse navbar
                    }
                });
            });
        </script>
    </body>
</html>
